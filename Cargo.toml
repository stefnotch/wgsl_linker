[package]
name = "wgsl_linker"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
thiserror = "1.0"
winnow = { version = "0.6.18" }
unicode-ident = "1.0"
slotmap = "1.0"
indexmap = "2.4.0"
arcstr = "1.2.0"
sourcemap = { version = "9.0.0", optional = true }

[dev-dependencies]
proptest = "1.5.0"
test-strategy = "0.4.0"

[features]
default = ["fs", "source_map"]
trace = ["winnow/debug"]
fs = []
source_map = ["dep:sourcemap"]
