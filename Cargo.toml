[package]
edition = "2021"
license-file = "LICENSE"
name = "wgsl_linker"
readme = "README.md"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
arcstr = "1.2.0"
indexmap = "2.7.1"
no-panic = "0.1.33"
slotmap = "1.0.7"
sourcemap = { version = "9.1.2", optional = true }
talc = { version = "4.4.2", default-features = false, features = ["lock_api"] }
thiserror = "2.0.11"
wasm-bindgen = "0.2.100"
winnow = { version = "0.6.26", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1.6.0"
test-strategy = "0.4.0"

[features]
default = []
fs = []
source_map = ["dep:sourcemap"]
trace = ["winnow/debug"]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 'z'
panic = "abort"
rpath = false
