[package]
edition = "2021"
license-file = "LICENSE"
name = "wgsl_linker"
readme = "README.md"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
arcstr = "1.2.0"
indexmap = "2.4.0"
slotmap = "1.0"
sourcemap = { version = "9.0.0", optional = true }
thiserror = "1.0"
unicode-ident = "1.0"
winnow = { version = "0.6.18" }

[dev-dependencies]
proptest = "1.5.0"
test-strategy = "0.4.0"

[features]
default = []
fs = []
source_map = ["dep:sourcemap"]
trace = ["winnow/debug"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 'z'

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-g', '-O']
