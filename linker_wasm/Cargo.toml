cargo-features = ["panic-immediate-abort"]

[package]
name = "linker_wasm"
version = "0.1.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[lib]
crate-type = ["cdylib"]

[dependencies]
no-panic = "0.1.36"
talc = { version = "5.0.3" }
wasm-bindgen = "0.2.118"
wesl_linker = { path = "../wesl_linker", default-features = false }

[profile.release]
opt-level = "z"
lto = true
panic = "immediate-abort"
codegen-units = 1
rpath = false
