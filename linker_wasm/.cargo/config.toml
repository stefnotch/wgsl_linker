# AAAAHHH I CAN'T ENABLE IT FOR A SINGLE PROFILE!
# https://github.com/johnthagen/min-sized-rust#abort-on-panic
[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]
build-std-features = ["optimize_for_size"]
panic-immediate-abort = true
rustflags = [
  "-Zlocation-detail=none",
  "-Zfmt-debug=none",
  "-C",
  "target-cpu=native",
]
